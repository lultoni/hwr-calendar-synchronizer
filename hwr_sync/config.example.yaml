# HWR Calendar Synchronizer — Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Quick start:
#   1. Fill in faculty, study_start_date, semesters, and calendar_name below.
#   2. Save and close this file.
#   3. Run: hwr-sync start
# ─────────────────────────────────────────────────────────────────────────────

# Your faculty slug.
# Find it on the HWR timetable page: https://moodle.hwr-berlin.de/fb2-stundenplan/
# The slug is the folder name in the timetable URL — e.g. the URL contains
# ".../fb2-stundenplaene/wi/semester1/kursa" → faculty is "wi".
# Common values: wi | informatik | IP | industrie | bank | bauwesen | dgm | dl
#                elektrotechnik | fm | handel | iba | immobilien | maschinenbau
#                ppm | spedition | steuern | tourismus | versicherung
faculty: "wi"

# First day of semester 1 — your personal Vorlesungsbeginn (e.g. "2024-10-01").
study_start_date: "2024-10-01"

# Your full semester plan.
#
# course: the course group in your timetable URL — check the URL on the HWR
#   timetable page. It ends in "/kursa", "/kursb", "/kursc", or just "/kurs"
#   for faculties without an a/b/c split. Use exactly that value here.
#
# end_date: last day of that semester INCLUDING any Praxisphase / internship.
#   When today is past all end_dates, the scheduler stops automatically.
#
# filters: optional block that overrides the global filters for this semester.
semesters:
  - number: 1
    course: "kursa"
    end_date: "2025-03-31"
  - number: 2
    course: "kursa"
    end_date: "2025-09-30"
  - number: 3
    course: "kursa"
    end_date: "2026-03-31"
  - number: 4
    course: "kursa"
    end_date: "2026-09-30"
  - number: 5
    course: "kursa"
    end_date: "2027-01-31"
    filters:
      groups:
        # Drop ALL WPF events, except the two you actually chose
        - match_regex: "(?i)WPF"
          keep:
            - "My WPF Course A"
            - "My WPF Course B"
  - number: 6
    course: "kursa"
    end_date: "2027-09-30"
    filters:
      groups:
        - match_regex: "(?i)WPF"
          keep:
            - "My WPF Course C"
            - "My WPF Course D"

# Name of the calendar to sync into.
# This calendar must already exist in Apple Calendar before you run hwr-sync.
# To have it created automatically, run: hwr-sync start --create-missing-calendar
calendar_name: "University"

# Calendar backend.
# "auto" detects your OS on first run and writes the detected value here.
# Supported: auto | apple | caldav | ics_file
calendar_backend: "auto"

# CalDAV server URL — only needed when calendar_backend is "caldav"
# caldav_url: "https://caldav.example.com/dav/calendars/user/university/"

# How often the scheduler syncs (in hours). Default: 6.
# You can also override this at runtime: hwr-sync start --interval 2
sync_interval_hours: 6

# Global filters — applied to all semesters that have no filters block of their own.
# Leave everything empty to keep all events.
filters:
  # Always drop events whose title contains one of these (case-insensitive substring)
  exclude_title_contains: []
  #  - "Wegezeit"

  # Always drop events matching one of these Python regular expressions
  exclude_by_regex: []
  #  - "^Englisch.*B1$"

  # Group filters: for each group, drop all matching events except those in keep.
  # You can define multiple independent groups.
  groups: []
  # - match_regex: "(?i)WPF"
  #   keep:
  #     - "My Chosen Elective"
  # - match_regex: "(?i)Englisch"
  #   keep:
  #     - "Englisch C1"
