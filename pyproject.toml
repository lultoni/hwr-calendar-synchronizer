[project]
name = "hwr-calendar-synchronizer"
version = "0.1.0"
description = "Automatically sync HWR Berlin timetable to your calendar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "icalendar>=5.0",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
apple = ["pyobjc-framework-EventKit>=10.0"]

[project.scripts]
hwr-sync = "hwr_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hwr_sync"]
